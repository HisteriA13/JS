<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Calculator</title>
  <meta name="keywords" content="HTML, CSS, JavaScript" />
  <meta name="description" content="Learning web development" />
  <meta name="author" content="Hilda Hadžić" />
  <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <img src="../$logo/logo.svg" alt="logo" id="logo" />

  <h1>Body Mass Index (BMI) Calculator</h1>

  <section class="container">
    <label for="height">Your Height (cm):</label>
    <input type="number" id="height" value="170" />

    <label for="weight">Your Weight (kg):</label>
    <input type="number" id="weight" value="60" />

    <button id="btn">Calculate BMI</button>

    <label for="result">Your BMI:</label>
    <input type="text" id="result" disabled />

    <h2 class="weight-condition"></h2>
  </section>

  <h3 class="message"></h3>

  <script src="script.js" defer></script>
</body>

</html>
