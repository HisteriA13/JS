<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="100%" height="100%">
    <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="#fb8b24ff"
      font-family="Consolas, Fira Code, Monaco, 'Courier New', monospace" font-size="64" font-weight="bold"
      letter-spacing="2">
      &lt;/hh&gt;
    </text>
  </svg>
  <h1>Digital Clock</h1>
  <div class="clock">

    <div>
      <span id="hour">00</span>
      <span class="text">Hours</span>
    </div>

    <div>
      <span id="minutes">00</span>
      <span class="text">Minutes</span>
    </div>

    <div>
      <span id="seconds">00</span>
      <span class="text">Seconds</span>
    </div>

  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
