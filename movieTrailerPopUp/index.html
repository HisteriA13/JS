<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Trailer Pop-Up</title>
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="../$logo/logo.svg" alt="logo" id="logo">

    <section class="container">
        <img src="assets/img/thumbnail.jpg" alt="" class="thumbnail">
        <h1>alcove`s code</h1>
        <p class="text">This is a quick trailer for a video I created during a study break from programming. It's a peek
            into my ideal cozy coding haven — complete with warm lights, endless coffee, and quiet focus.</p>
        <button class="btn">Watch</button>
    </section>

    <div id="movie" class="hide">
        <video src="assets/video/trailer.mp4" class="hide" controls muted></video>
        <i class="fa-regular fa-circle-xmark close"></i>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
