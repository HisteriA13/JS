<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Image Slider</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img src="../$logo/logo.svg" alt="logo" id="logo">

    <h1>&OpenCurlyDoubleQuote; The 27 Club &CloseCurlyDoubleQuote;</h1>

    <section class="container">
        <figure class="item">
            <img src="img/kurt-cobain.jpg" alt="">
        </figure>
        <figure class="item">
            <img src="img/richey-edwards.jpg" alt="">
        </figure>
        <figure class="item">
            <img src="img/amy-winehouse.jpg" alt="">
        </figure>
        <figure class="item">
            <img src="img/brian-jones.jpg" alt="">
        </figure>
        <figure class="item">
            <img src="img/jimi-hendrix.jpg" alt="">
        </figure>
        <figure class="item">
            <img src="img/janis-joplin.jpg" alt="">
        </figure>
        <figure class="item">
            <img src="img/jim-morrison.jpg" alt="">
        </figure>
    </section>

    <p class="name"></p>

    <section class="btns">
        <div class="arrow previous"></div>
        <div class="arrow next"></div>
    </section>

    <script src="script.js" defer></script>
</body>

</html>
