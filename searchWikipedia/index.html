<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="description" content="Learning web development">
    <meta name="author" content="Hilda Hadžić">
    <link rel="shortcut icon" href="../$logo/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <figure>
            <img src="../$logo/logo.svg" alt="logo" id="logo">
        </figure>
    </header>

    <main>
        <section class="container">
            <div class="heading">
                <figure>
                    <img class="img" src="img/wikipediaLogo.png" alt="Wikipedia Logo" aria-hidden="true">
                </figure>
                <h1 class="title">Wikipedia Search</h1>
            </div>
            <form class="form">
                <input type="text" class="input">
                <button type="submit" class="btn">Search</button>
            </form>

            <div class="loading hidden">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid" width="200"
                    height="200" style="shape-rendering: auto; display: block;"
                    xmlns:xlink="http://www.w3.org/1999/xlink">
                    <g>
                        <circle cx="50" cy="50" r="32" stroke-width="8" stroke="#d8bfd8"
                            stroke-dasharray="50.26548245743669 50.26548245743669" fill="none" stroke-linecap="round">
                            <animateTransform attributeName="transform" type="rotate" repeatCount="indefinite" dur="1s"
                                keyTimes="0;1" values="0 50 50;360 50 50"></animateTransform>
                        </circle>
                        <g></g>
                    </g><!-- [ldio] generated by https://loading.io -->
                </svg>
            </div>

            <div class="errorEmpty hidden">
                <p>Please enter valid search term.</p>
            </div>
            <div class="errorNetwork hidden">
                <p>There was an error...</p>
            </div>
            <div class="errorResults hidden">
                <p>No matching results...</p>
            </div>

            <!-- JAVASCRIPT -->
            <div class="result"></div>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>

</html>
